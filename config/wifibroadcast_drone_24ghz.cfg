# Fichier de RÉFÉRENCE versionné pour /etc/wifibroadcast.cfg (Pi Zero,
# drone). Le vrai fichier système n'est PAS versionné
# directement (fichier hors dépôt git). Workflow :
#   1. Modifier CE fichier ici, commit/push
#   2. Appliquer manuellement sur le système :
#      sudo cp config/wifibroadcast_drone.cfg /etc/wifibroadcast.cfg
#      sudo systemctl restart wfb-server-drone.service
#   3. Toujours faire un .bak du fichier système avant d'écraser
#

[common]
wifi_channel = 6
wifi_region = 'FR'

[drone_video]
mcs_index = 3  # MCS1->3 : rafale IDR sous la periode de frame, echappe au fec_delay tunnel
peer = 'listen://0.0.0.0:5602'
bandwidth = 40  # Test HT40, canal 6 (2437MHz) — marge suffisante des deux côté

[drone_mavlink]
peer = 'listen://0.0.0.0:14560'
